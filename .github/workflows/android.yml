name: Android (Appium)

# Runs from the CI workflow on pushes to main (workflow_call), or by hand from the Actions tab.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  API_LEVEL: 34
  EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none

jobs:
  appium:
    name: Appium on an Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci

      - name: Cache the demo app APK
        uses: actions/cache@v6
        with:
          path: apps
          key: demo-app-${{ hashFiles('tests/mobile/demo-app.ts') }}
      - run: npm run mobile:download-app

      # Lets the emulator use the runner's hardware virtualisation (much faster than software).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Booting a fresh emulator is slow; a cached, already-booted snapshot starts in seconds.
      - name: Cache the emulator (AVD) snapshot
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-google_apis-x86_64

      - name: Create the emulator and save a snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "Emulator snapshot created."

      - name: Run the Appium suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          script: npm run test:mobile

      - name: Job summary
        if: always()
        run: npx tsx scripts/summarize-results.ts "Android native app (Appium, API ${{ env.API_LEVEL }} emulator)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-results-android
          path: reports/allure-results
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: appium-log
          path: reports/wdio-appium.log
          if-no-files-found: ignore
          retention-days: 7
